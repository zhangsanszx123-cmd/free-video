name: Test, build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-video-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: freevideo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Deployment script tests
        run: node --test "deploy/tests/*.test.mjs"
      - name: Validate deployment scripts
        run: for script in deploy/deploy.sh deploy/receive-release.sh deploy/setup-server.sh; do bash -n "$script"; done; python3 -m py_compile deploy/image-config-id.py
      - name: Backend tests (CI MySQL service, no production data)
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-root-password
          MYSQL_DATABASE: freevideo_ci_main
          MYSQL_TEST_DATABASE: freevideo_test
        run: |
          pip install -r requirements.txt
          python -m pytest -q --tb=short -rf
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ghcr.io/zhangsanszx123-cmd/free-video:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package verified image for SSH delivery
        run: |
          set -euo pipefail
          SOURCE_IMAGE="ghcr.io/zhangsanszx123-cmd/free-video:$GITHUB_SHA"
          mkdir -p dist
          IMAGE_ID=$(docker image save "$SOURCE_IMAGE" | python3 deploy/image-config-id.py -)
          [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE="ghcr.io/zhangsanszx123-cmd/free-video:sha256-${IMAGE_ID#sha256:}"
          docker tag "$SOURCE_IMAGE" "$IMAGE"
          docker save "$IMAGE" | gzip -1 > dist/image.tar.gz
          ARCHIVE_SHA256=$(sha256sum dist/image.tar.gz | cut -d ' ' -f 1)
          export IMAGE IMAGE_ID ARCHIVE_SHA256
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs'
          const {IMAGE: image, IMAGE_ID: imageId, ARCHIVE_SHA256: archiveSha256} = process.env
          writeFileSync('dist/metadata.json', JSON.stringify({image, imageId, archiveSha256}) + '\n')
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: free-video-production-image
          path: |
            dist/image.tar.gz
            dist/metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Environment production is missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - uses: actions/download-artifact@v4
        with:
          name: free-video-production-image
          path: release-image
      - name: Optimize runner TCP for high-latency SSH
        run: |
          sudo modprobe tcp_bbr 2>/dev/null || true
          if sudo sysctl -w net.ipv4.tcp_congestion_control=bbr; then
            echo "TCP BBR enabled for this temporary runner."
          else
            echo "::notice::BBR unavailable; keeping the runner default TCP settings."
          fi
      - name: Send verified image over SSH and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: node deploy/send-image.mjs --directory release-image
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
